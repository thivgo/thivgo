<svg xmlns="http://www.w3.org/2000/svg" width="490" height="236" viewBox="0 0 490 236" role="img" aria-label="CareSync — App para famílias que cuidam de alguém mais velho: calendário compartilhado, tarefas divididas entre os parentes e um perfil para cada pessoa cuidada."><title>CareSync — App para famílias que cuidam de alguém mais velho: calendário compartilhado, tarefas divididas entre os parentes e um perfil para cada pessoa cuidada.</title><defs></defs><style>@font-face{font-family:'Geist Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
