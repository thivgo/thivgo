<svg xmlns="http://www.w3.org/2000/svg" width="490" height="236" viewBox="0 0 490 236" role="img" aria-label="Uffizi Uniformes — Site de uma fábrica de uniformes corporativos. Comecei pela landing page e depois reconstruí tudo em Nuxt com SSR."><title>Uffizi Uniformes — Site de uma fábrica de uniformes corporativos. Comecei pela landing page e depois reconstruí tudo em Nuxt com SSR.</title><defs></defs><style>@font-face{font-family:'Geist Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
